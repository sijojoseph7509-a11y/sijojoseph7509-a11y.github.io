<!-- Project reels, v3 (v192). One motion system for every project, each in its own brand language.
     Structure, always: what it is → the problem → one scene per feature → the result.
     Canvas 1920 × 1080 · margins 128 · left column 660 (step + kinetic headline) · product on the right. In each feature the camera
     pushes into it, a spotlight ring draws in and a short label is pinned under it. Scenes push into each other; frames swing in with depth.
     Every animation is one Web Animations track over the whole reel, so record.mjs can seek any frame exactly.
     Preview: open reel.html?p=<slug> in a browser. -->
