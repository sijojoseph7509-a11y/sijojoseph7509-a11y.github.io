<!doctype html>
<!-- 15-second project reels (v190). One page, one config per project: five 3-second beats of real material with one caption each.
     tools/reels/record.mjs opens reel.html?p=<slug>, calls start() and records it into work/<slug>/fx/reel.mp4 (+ reel-540.mp4, poster). -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1440px; height: 810px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
  .beat { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; display: grid; place-items: center; }
  .beat.on { opacity: 1; }
  .beat .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); transition: transform 3.6s ease-out; }
  .beat.on .full { transform: scale(1.12); }
  .beat .full.top { object-position: 50% 0; }
  .beat .full.zoomR { transform-origin: 82% 28%; transform: scale(1.55); } .beat.on .full.zoomR { transform: scale(1.68); }   /* the idols, not the photo's own headline */
  /* caption: one sentence at a time, bottom left */
  .cap { position: absolute; left: 64px; bottom: 60px; max-width: 760px; padding: 18px 26px 20px; border-radius: 22px; background: var(--capbg); color: var(--capfg);
    font: 600 34px/1.18 var(--font, Inter), sans-serif; letter-spacing: -.01em; box-shadow: 0 20px 50px -20px rgba(0,0,0,.45); opacity: 0; transform: translateY(18px);
    transition: opacity .5s ease .25s, transform .6s cubic-bezier(.2,.8,.2,1) .25s; z-index: 5; }
  .beat.on .cap { opacity: 1; transform: none; }
  .tag { position: absolute; left: 64px; top: 52px; z-index: 6; font: 600 15px/1 Inter; letter-spacing: .14em; text-transform: uppercase; color: var(--tagfg); }
  .dots { position: absolute; right: 64px; top: 52px; z-index: 6; display: flex; gap: 8px; }
  .dots i { width: 26px; height: 4px; border-radius: 2px; background: var(--dot); }
  .dots i.on { background: var(--accent); }
  /* a Studio Display for screen films */
  .studio { position: relative; width: 860px; margin-top: -90px; display: grid; justify-items: center; }
  .studio .scr { width: 100%; padding: 1.3%; border-radius: 16px; background: #0d0d0f; box-shadow: 0 0 0 1.5px #d4d6db, 0 0 0 3px #a9acb3, 0 40px 80px -30px rgba(0,0,0,.6); }
  .studio video, .studio img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 3px; }
  .studio .neck { width: 16%; height: 50px; background: linear-gradient(90deg, #a9acb3, #e7e8eb 40%, #f3f4f6 55%, #b9bcc2); clip-path: polygon(10% 0, 90% 0, 100% 100%, 0 100%); }
  .studio .foot { width: 26%; height: 9px; border-radius: 2px 2px 7px 7px; background: linear-gradient(#f1f2f4, #b5b8be); }
  /* iPhones */
  .phones { display: flex; gap: 44px; align-items: flex-start; margin-top: -60px; }
  .iphone { position: relative; width: 250px; padding: 8px; border-radius: 42px / 19px; background: #0b0b0c; box-shadow: 0 0 0 2px #4a4a4f, 0 30px 60px -20px rgba(0,0,0,.55); }
  .iphone .s { position: relative; width: 100%; aspect-ratio: 412 / 917; border-radius: 34px / 16px; overflow: hidden; background: #fff; }
  .iphone .s img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; transition: opacity .35s ease; }
  .iphone .island { position: absolute; top: 2.4%; left: 50%; translate: -50% 0; width: 30%; aspect-ratio: 3.6; border-radius: 99px; background: #000; z-index: 2; }
  .phones .iphone { opacity: 0; transform: translateY(40px); transition: opacity .5s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .beat.on .phones .iphone { opacity: 1; transform: none; }
  .beat.on .phones .iphone:nth-child(2) { transition-delay: .25s; } .beat.on .phones .iphone:nth-child(3) { transition-delay: .5s; }
  .one .iphone { width: 300px; border-radius: 48px / 22px; } .one .iphone .s { border-radius: 40px / 18px; }
  .tap { position: absolute; width: 16%; aspect-ratio: 1; margin: -8% 0 0 -8%; border-radius: 50%; background: rgba(40,40,46,.3); border: 2px solid rgba(255,255,255,.95); opacity: 0; z-index: 3; }
  .tap.go { animation: tap .9s ease-out forwards; }
  @keyframes tap { 0% { opacity: 0; transform: scale(1.5); } 28% { opacity: 1; transform: scale(1); } 48% { transform: scale(.78); } 100% { opacity: 0; transform: scale(1.1); } }
  /* a 360 world panning */
  .pano { position: absolute; inset: 0; background-size: auto 100%; background-repeat: repeat-x; animation: none; }
  .beat.on .pano { animation: pan 6s linear forwards; }
  @keyframes pan { from { background-position: 0 0; } to { background-position: -520px 0; } }
  /* tickets fanning in */
  .tickets { display: flex; gap: 26px; margin-top: -40px; }
  .tickets img { width: 190px; border-radius: 6px; box-shadow: 0 24px 50px -18px rgba(60,30,0,.45); opacity: 0; transform: translateY(60px) rotate(var(--r)); transition: opacity .5s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  .beat.on .tickets img { opacity: 1; transform: translateY(0) rotate(var(--r)); }
  .beat.on .tickets img:nth-child(2) { transition-delay: .2s; } .beat.on .tickets img:nth-child(3) { transition-delay: .4s; } .beat.on .tickets img:nth-child(4) { transition-delay: .6s; }
  /* end card */
  .end { text-align: center; color: var(--endfg); }
  .end h1 { font: 700 120px/1 var(--font, Inter), sans-serif; letter-spacing: -.035em; opacity: 0; transform: translateY(24px); transition: all .7s cubic-bezier(.2,.8,.2,1) .1s; }
  .end p { margin-top: 26px; font: 500 30px/1.3 Inter; max-width: 900px; opacity: 0; transition: opacity .6s ease .5s; }
  .end small { display: block; margin-top: 22px; font: 600 16px/1 Inter; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); opacity: 0; transition: opacity .6s ease .8s; }
  .beat.on .end h1, .beat.on .end p, .beat.on .end small { opacity: 1; transform: none; }
  .framed { width: 980px; aspect-ratio: 4 / 3; border-radius: 22px; overflow: hidden; margin-top: -70px; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6); }
  .framed img, .framed video { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head>
<body><div class="stage" id="stage"></div>
<script>
const W = "../../work/";
const R = {
  handovo: { name: "Handovo", font: "Inter", c: { bg: "#2F3BEA", accent: "#D4FF3A", capbg: "#D4FF3A", capfg: "#0B0B0F", tagfg: "rgba(255,255,255,.75)", dot: "rgba(255,255,255,.3)", endfg: "#fff" },
    beats: [
      { img: W + "handovo/fx/cover-slide@2x.webp", cls: "top", cap: "A store manager’s plan, on every staff phone." },
      { studio: W + "handovo/fx/goal.mp4", cap: "The manager writes one goal, in plain words." },
      { studio: W + "handovo/fx/plan.mp4", cap: "The AI drafts the tasks: an owner and a reason for each." },
      { phones: ["../handovo/shots/phone06.webp", "../handovo/shots/phone08.webp", "../handovo/shots/phone12.webp"], cap: "Staff get only their own tasks, in their own language." },
      { end: ["Handovo", "8,019 tests. It never went past the manager’s limits.", "Designed and built by Sijo Joseph"] } ] },
  carekin: { name: "Carekin", font: "Inter", c: { bg: "#0F3B38", accent: "#FF8A6B", capbg: "#FFFFFF", capfg: "#0F3B38", tagfg: "rgba(255,255,255,.7)", dot: "rgba(255,255,255,.25)", endfg: "#fff" },
    beats: [
      { img: W + "carekin/fx/cover-slide@2x.webp", cls: "top", cap: "When Amma’s medicine changes, who hears about it?" },
      { seq: [["scan", 206, 768], ["check"]], cap: "Priya scans the new prescription; anything unclear, she checks." },
      { seq: [["change", 206, 440], ["today"]], cap: "The change stays open until every carer has seen it." },
      { seq: [["wa-before", 162, 514], ["wa"]], cap: "Lakshmi taps Given on WhatsApp, in Malayalam." },
      { end: ["Carekin", "One medicine plan, seen three ways.", "UX and product design · Sijo Joseph"] } ] },
  ekmaati: { name: "Ek maati", font: "Inter", c: { bg: "#1D1410", accent: "#F5A623", capbg: "#F5A623", capfg: "#1D1410", tagfg: "rgba(255,255,255,.7)", dot: "rgba(255,255,255,.25)", endfg: "#F7EFE3" },
    beats: [
      { img: W + "ekmaati/05@2x.webp", cls: "zoomR", cap: "Pen’s clay Ganesh idols are sold by the row: no name, no maker." },
      { img: W + "ekmaati/fx/cover-slide@2x.webp", cls: "top", cap: "I gave them a name and a mark: Ek maati, one clay." },
      { framed: W + "ekmaati/fx/film-unbox.mp4", cap: "A temple-shaped box that folds with no tape or plastic." },
      { framedImg: W + "ekmaati/fx/real/temple-34@2x.webp", cap: "Prototyped by hand, three times." },
      { end: ["Ek maati", "Brand identity and packaging for the clay idols of Pen.", "Branding and packaging · Sijo Joseph"] } ] },
  syntra: { name: "Syntra", font: "Lato", c: { bg: "#F4E7D4", accent: "#BD680F", capbg: "#3A1F0B", capfg: "#F7EBDD", tagfg: "rgba(58,31,11,.6)", dot: "rgba(58,31,11,.18)", endfg: "#3A1F0B" },
    beats: [
      { img: W + "syntra/fx/cover-slide@2x.webp", cls: "top", cap: "Know the feeling, not the name?" },
      { framedLoop: ["loop-0", "loop-1", "loop-2", "loop-3"].map((n) => W + "syntra/fx/" + n + ".webp"), cap: "Turn a knob and three sliders to say how it should feel." },
      { pano: W + "syntra/fx/pano-lakeside_night.webp", cap: "Then step inside your scent: one of nine 360° worlds." },
      { tickets: ["140032", "164936", "170525", "200951"].map((n) => W + "syntra/fx/receipt-" + n + ".webp"), cap: "Take it home: a printed ticket that comes alive in AR." },
      { end: ["Syntra", "66 tickets printed at our exhibit.", "Interaction design · NID · team of 3"] } ] },
};
const P = R[new URLSearchParams(location.search).get("p") || "handovo"];
for (const [k, v] of Object.entries(P.c)) document.documentElement.style.setProperty("--" + k, v);
document.documentElement.style.setProperty("--font", P.font);
const live = (f) => W + "carekin/fx/live-" + f + ".webp";
const stage = document.getElementById("stage");
const html = (b, i) => {
  let m = "";
  if (b.img) m = `<img class="full ${b.cls || ""}" src="${b.img}" alt="">`;
  if (b.studio) m = `<div class="studio"><div class="scr"><video src="${b.studio}" muted playsinline preload="auto"></video></div><i class="neck"></i><i class="foot"></i></div>`;
  if (b.phones) m = `<div class="phones">${b.phones.map((s) => `<div class="iphone"><div class="s"><img src="${s}" alt=""></div><i class="island"></i></div>`).join("")}</div>`;
  if (b.seq) m = `<div class="phones one"><div class="iphone"><div class="s">${b.seq.map(([f], k) => `<img src="${live(f)}" alt="" style="opacity:${k ? 0 : 1}">`).join("")}<i class="tap"></i></div><i class="island"></i></div></div>`;
  if (b.framed) m = `<div class="framed"><video src="${b.framed}" muted playsinline preload="auto"></video></div>`;
  if (b.framedImg) m = `<div class="framed"><img src="${b.framedImg}" alt=""></div>`;
  if (b.framedLoop) m = `<div class="framed" style="aspect-ratio:16/9; width:1000px">${b.framedLoop.map((s, k) => `<img src="${s}" alt="" style="position:absolute; inset:0; opacity:${k ? 0 : 1}; transition:opacity .3s">`).join("")}</div>`;
  if (b.pano) m = `<div class="pano" style="background-image:url('${b.pano}')"></div>`;
  if (b.tickets) m = `<div class="tickets">${b.tickets.map((s, k) => `<img src="${s}" alt="" style="--r:${[-6, 3, -2, 5][k]}deg">`).join("")}</div>`;
  if (b.end) m = `<div class="end"><h1>${b.end[0]}</h1><p>${b.end[1]}</p><small>${b.end[2]}</small></div>`;
  return `<section class="beat" data-i="${i}">${m}${b.cap ? `<p class="cap">${b.cap}</p>` : ""}</section>`;
};
stage.innerHTML = P.beats.map(html).join("") + `<p class="tag">${P.name}</p><div class="dots">${P.beats.map(() => "<i></i>").join("")}</div>`;
const beats = [...stage.querySelectorAll(".beat")], dots = [...stage.querySelectorAll(".dots i")];
const BEAT = 3000;
function play(i) {
  beats.forEach((b, k) => b.classList.toggle("on", k === i)); dots.forEach((d, k) => d.classList.toggle("on", k <= i));
  const b = beats[i], cfg = P.beats[i];
  b.querySelectorAll("video").forEach((v) => { v.currentTime = 0; v.play(); });
  if (cfg.seq) {   // the prototype: tap, next screen
    const imgs = [...b.querySelectorAll(".s img")], tap = b.querySelector(".tap"); let k = 0;
    const step = () => { const [, x, y] = cfg.seq[k]; if (x == null) return;
      tap.style.left = x / 412 * 100 + "%"; tap.style.top = y / 917 * 100 + "%"; tap.classList.remove("go"); void tap.offsetWidth; tap.classList.add("go");
      setTimeout(() => { imgs[k].style.opacity = 0; k++; imgs[k].style.opacity = 1; setTimeout(step, 1100); }, 420); };
    setTimeout(step, 900);
  }
  if (cfg.framedLoop) { const imgs = [...b.querySelectorAll(".framed img")]; let k = 0;
    const t = setInterval(() => { imgs[k].style.opacity = 0; k = (k + 1) % imgs.length; imgs[k].style.opacity = 1; }, 700); setTimeout(() => clearInterval(t), BEAT); }
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.decode().catch(() => {})),
  ...[...document.querySelectorAll("video")].map((v) => new Promise((r) => { if (v.readyState >= 3) r(); else { v.addEventListener("canplaythrough", r, { once: true }); setTimeout(r, 8000); } }))]);
window.start = () => { beats.forEach((_, i) => setTimeout(() => play(i), i * BEAT)); };
window.DURATION = P.beats.length * BEAT;
if (!navigator.webdriver) window.ready.then(() => window.start());   // open it in a browser to preview
</script></body></html>
