<!doctype html>

  <meta name="description" content="Sijo Joseph — product designer, brand strategist and experience designer.">
  <script>
    // Self-update: phones often reopen a saved copy of this page. If a newer version has been
    // published (version.json, never cached), load it. BUILD must match version.json and ?v= below.
    (() => {
      const BUILD = "43";
      const check = () => fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : null))
        .then((v) => {
          if (!v || String(v.build) === BUILD || (window.OS && window.OS.isOpen())) return;
          const u = new URL(location.href);
          if (u.searchParams.get("v") === String(v.build)) return;              // already tried this exact version: never loop
          try { if (sessionStorage.getItem("updatedTo") === String(v.build)) return; sessionStorage.setItem("updatedTo", String(v.build)); } catch (_) {}
          u.searchParams.set("v", v.build);                                      // new URL → never served from cache
          location.replace(u.href);
        })
        .catch(() => {});
      check();
      addEventListener("pageshow", (e) => { if (e.persisted) check(); });                       // restored from back/forward cache
      // tab reopened after being away a while (not a quick app switch — never reload mid-interaction)
      let hiddenAt = 0;
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") hiddenAt = Date.now();
        else if (hiddenAt && Date.now() - hiddenAt > 60000) check();
      });
    })();
  </script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=43">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <!-- (after the import map, which must come first) fetch the 3D engine in parallel straight away; the models are fetched by main.js once the engine has arrived, so on slow connections they never compete with it -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js" crossorigin>

  <link rel="modulepreload" href="main.js?v=43">
</head>
<body>

  <div id="stage" class="stage" aria-label="Interactive 3D desk. Click the laptop to open the portfolio."></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- HUD -->
  <button class="hud hud-left" id="zoomBtn" aria-label="Zoom in">

  </button>
  <button class="hud hud-right" id="soundBtn" aria-label="Mute sound">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path id="soundWaves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  </button>
  <nav class="topnav" aria-label="Portfolio">
    <a href="#work" data-boot="work">Work</a>
    <a href="#resume" data-boot="resume">Resume</a>
    <a href="#contact" data-boot="contact">Contact</a>
  </nav>

      <span class="loader-name" aria-label="Sijo Joseph">SJ</span>
      <div class="loader-bar"><i id="loaderBar"></i></div>
      <span class="loader-quote">Good things take time</span>
      <span class="loader-pct" id="loaderPct">assembling desk… 0%</span>
    </div>
  </div>

  <!-- Desktop (opens when the laptop boots) -->
  <div class="os" id="os" hidden>
    <div class="os-screen" id="osScreen">
      <header class="menubar">
        <div class="mb-left" id="menubar">
          <button class="mb-logo" data-menu="portfolio" aria-label="Portfolio menu">SJ</button>
          <button class="mb-app" data-menu="portfolio" id="mbApp">Portfolio</button>
          <button data-menu="file">File</button>
          <button data-menu="edit">Edit</button>
          <button data-menu="view">View</button>
          <button data-menu="go">Go</button>
          <button data-menu="window">Window</button>
          <button data-menu="help">Help</button>
        </div>
        <div class="mb-right">
          <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M8.5 2.2c2.3 0 4.4.9 6 2.4l1-1A9.9 9.9 0 0 0 8.5.8 9.9 9.9 0 0 0 1.5 3.6l1 1c1.6-1.5 3.7-2.4 6-2.4zm0 3c1.5 0 2.8.6 3.9 1.5l1-1a7 7 0 0 0-9.8 0l1 1c1.1-.9 2.4-1.5 3.9-1.5zm0 3c.7 0 1.3.3 1.8.7L8.5 10.7 6.7 8.9c.5-.4 1.1-.7 1.8-.7z" fill="currentColor"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12" aria-hidden="true"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="16" height="8" rx="1.6" fill="currentColor"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4z" fill="currentColor" opacity=".45"/></svg>
          <button class="mb-icon" id="mbSearch" aria-label="Search (⌘K)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg></button>
          <span class="mb-icon" aria-hidden="true"><svg width="16" height="14" viewBox="0 0 24 20" fill="currentColor"><rect x="1" y="1" width="22" height="7.5" rx="3.75"/><circle cx="18.6" cy="4.75" r="2.4" fill="#000" fill-opacity=".35"/><rect x="1" y="11.5" width="22" height="7.5" rx="3.75" fill-opacity=".55"/><circle cx="5.4" cy="15.25" r="2.4"/></svg></span>
          <span id="clock"></span>
        </div>
      </header>

      <aside class="widget glass" id="widget"></aside>

      <section class="win" id="win" role="dialog" aria-labelledby="winTitle">
        <!-- macOS 27 layout: the sidebar runs the full height to the window edge, window controls sit on it -->
        <aside class="side-wrap">
          <div class="lights">
            <button class="red" id="winClose" aria-label="Close window"></button>
            <button class="yellow" id="winMin" aria-label="Minimise window"></button>
            <button class="green" id="winMax" aria-label="Zoom window"></button>
          </div>
          <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
        </aside>
        <div class="win-col">
          <!-- unified toolbar -->
          <header class="win-bar" id="winBar">
            <span class="win-title" id="winTitle">About</span>
            <div class="tb-tools" aria-hidden="true">
              <span class="tb-btn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></span>
              <span class="tb-btn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></span>
            </div>
          </header>
          <div class="win-body" id="winBody"></div>
        </div>
      </section>

      <nav class="dock" id="dock" aria-label="Dock"></nav>
      <div class="mb-menu" id="mbMenu" role="menu" hidden></div>
      <div class="spotlight" id="spotlight" role="dialog" aria-label="Search" hidden>
        <div class="sp-panel">
          <div class="sp-field"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.6-4.6"/></svg>
            <input id="spInput" type="text" placeholder="Search Sijo's portfolio" autocomplete="off" spellcheck="false" aria-label="Search"></div>
          <ul class="sp-results" id="spResults" role="listbox"></ul>
        </div>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>

</html>
